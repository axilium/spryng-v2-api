paths:
  /balance:
    get:
      operationId: balance
      summary: "Balance: Get"
      tags:
        - balance
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/balance/v2-balance
      description: |-
        This endpoint returns the balance of an parent account or sub account, only accounts linked with the credentials used can perform the request. Note this ony applies if you are a prepay customer, if you would like more information please speak with your account manager.

        Before you start your implementation, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites.
      parameters:
        - name: AccountReference
          in: header
          required: true
          description: Your Spryng account reference - e.g. SPNL0000000
          schema:
            type: string
      responses:
        "201":
          description: Created The request succeeded, and a new resource was created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: string
                  reserved:
                    type: string
              example:
                available: "2951.73346"
                reserved: "0"
        "400":
          description: Bad Request The server could not understand the request due to incorrect syntax or an incorrect/missing required property. You should not repeat the request without modifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: string
                    errorMessage: string
                    metadata:
                      additionalProp1: string
                      additionalProp2: string
                      additionalProp3: string
        "401":
          description: Unauthorized Indicates that the request has failed due to missing or incorrect authentication information. You can repeat the request with a suitable authorization header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: unauthenticatedError
                    errorMessage: Request for authenticated route '/v2/balance' was unauthenticated
  /balance-alerts:
    post:
      operationId: balanceAlerts
      summary: "Balance: Balance alert"
      tags:
        - balance
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/balance/v2-balance-alerts
      description: |-
        This endpoint can be used to set an alert once a prepaid balance threshold has been reached, multiple email addresses can be used in the array of the body.

        Before you start your implementation, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites.
      parameters:
        - name: AccountReference
          in: header
          required: true
          description: Your Spryng account reference - e.g. SPNL0000000
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                threshold:
                  type: string
                enabled:
                  type: boolean
                contactChannel:
                  type: string
                contactAddress:
                  type: string
                alertType:
                  type: string
              required:
                - threshold
                - enabled
                - contactChannel
                - contactAddress
            example:
              alertType: alertType
              threshold: 0
              enabled: false
              contactChannel: contactChannel
              contactAddress: contactAddress
      responses:
        "201":
          description: Created The request succeeded, and a new resource was created as a result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      alertType:
                        type: string
                      threshold:
                        type: number
                      enabled:
                        type: boolean
                      contactChannel:
                        type: string
                      contactAddress:
                        type: string
              example:
                data:
                  alertType: LOW_BALANCE
                  threshold: 1
                  enabled: true
                  contactChannel: EMAIL
                  contactAddress: email@commify.com
        "400":
          description: Bad Request The server could not understand the request due to incorrect syntax or an incorrect/missing required property. You should not repeat the request without modifications.
        "401":
          description: Unauthorized Indicates that the request has failed due to missing or incorrect authentication information. You can repeat the request with a suitable authorization header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: unauthenticatedError
                    errorMessage: Request for authenticated route '/v2/balance-alerts' was unauthenticated
  /contacts:
    post:
      operationId: contactsCreate
      summary: "Contacts: Create"
      tags:
        - contacts
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/contacts/v2-contacts-create
      description: |-
        This endpoint allows you to add a single contact in a single API call. This is the ideal tool for synchronising your contact list from another system, such as a CRM, an e-commerce platform, or a customer database, ensuring your contacts are always up-to-date.

        The documentation in this section contains the core reference information you will need to create contacts via our API, including required headers, cURL sample & error codes.

        Before you start using this endpoint, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountReference:
                  type: string
                contacts:
                  type: object
                  properties:
                    firstName:
                      type: string
                    lastName:
                      type: string
                    addressType:
                      type: object
                    addressValue:
                      type: string
                  required:
                    - firstName
                    - lastName
                firstName:
                  type: string
                lastName:
                  type: string
                quickName:
                  type: string
                addresses:
                  type: array
                  items:
                    type: object
                    properties:
                      addressType:
                        type: string
                      addressValue:
                        type: string
                      optOutStatus:
                        type: string
                contactMetadata:
                  type: array
                  items:
                    type: string
              required:
                - accountReference
            example:
              accountReference: SPNLxxxxxx
              firstName: firstName
              lastName: lastName
              quickName: quickName
              addresses:
                - addressType: addressType
                  addressValue: addressValue
                  optOutStatus: optOutStatus
              contactMetadata: []
      responses:
        "201":
          description: Created Success response with the following example body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      contactId:
                        type: string
                        format: uuid
                      accountReference:
                        type: string
                      firstName:
                        type: string
                      lastName:
                        type: string
                      quickName:
                        type: string
                      lastUpdatedBy:
                        type: string
                        format: uuid
                      createTimestamp:
                        type: string
                        format: date-time
                      lastUpdateTimestamp:
                        type: string
                        format: date-time
                      addresses:
                        type: array
                        items:
                          type: object
                          properties:
                            addressId:
                              type: string
                              format: uuid
                            addressType:
                              type: string
                            addressValue:
                              type: string
                            destinationCode:
                              type: string
                      contactMetadata:
                        type: object
                        properties:
                          team:
                            type: string
              example:
                data:
                  contactId: c129b89f-515a-43e1-b990-91fc2de3d566
                  accountReference: SPNL0000000
                  firstName: Team
                  lastName: Octopus
                  quickName: TOCT1
                  lastUpdatedBy: 907da4a7-bb93-4772-8af4-a95cc59e5a91
                  createTimestamp: "2024-11-25T13:28:17.087042Z"
                  lastUpdateTimestamp: "2024-11-25T13:28:17.087042Z"
                  addresses:
                    - addressId: 7ba907b4-ff85-4825-a413-d6b634b16536
                      addressType: MSISDN
                      addressValue: "+447711000022"
                      destinationCode: GB
                  contactMetadata:
                    team: octopus
        "400":
          description: |-
            Bad Request Indicates the server couldn't process the request due to one or more of the required fields being invalid or missing.

            Response example
        "401":
          description: |-
            Unauthorized The server couldn't process the request as the authorization header was missing or invalid.

            Response example
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: An error occurred while processing the request
                status: 401
                errors: []
                internalErrors:
                  - message: Pipeline
                    metadata:
                      unauthenticatedError: Request for authenticated route '/v2/contacts' was unauthenticated
        "409":
          description: |-
            Conflict The server couldn't process the request as a record with matching contact data already exists.

            Response example
    delete:
      operationId: contactsDelete
      summary: "Contacts: Delete"
      tags:
        - contacts
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/contacts/v2-contacts-delete
      description: |-
        This endpoint allows you to delete a contact in a single API call. This is the perfect tool for maintaining your contact list from another system, such as a CRM, an e-commerce platform, or a customer database, ensuring your contacts are always up-to-date.

        The documentation in this section contains the core reference information you will need to delete contacts via our API, including required headers, cURL sample & error codes.

        Before you start using this endpoint, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites.
      parameters:
        - name: contactId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: |-
            OK Success response with empty body.

            Error codes
        "401":
          description: Unauthorized Indicates that the request has failed due to missing or incorrect authentication information. You can repeat the request with a suitable authorization header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: An error occurred while processing the request
                status: 401
                errors: []
                internalErrors:
                  - message: Pipeline
                    metadata:
                      unauthenticatedError: Request for authenticated route '/v2/contacts' was unauthenticated
  /contacts/bulk:
    post:
      operationId: contactsBulkCreate
      summary: "Contacts: Bulk create"
      tags:
        - contacts
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/contacts/v2-contacts-bulk-create
      description: |-
        This endpoint allows you to add a list of new contacts in bulk with a single API request. 

        Note: Existing contact records will not be updated when using this endpoint. To add and update existing records in the same call, please refer to the the Bulk update/create endpoint documentation.

        The documentation in this section contains the core reference information you will need to create contacts via our API, including required headers, cURL sample & error codes.

        Before you start using this endpoint, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountReference:
                  type: string
                contacts:
                  type: array
                  items:
                    type: object
                    properties:
                      firstName:
                        type: string
                      lastName:
                        type: string
                      quickName:
                        type: string
                      addresses:
                        type: array
                        items:
                          type: object
                          properties:
                            addressType:
                              type: string
                            addressValue:
                              type: string
                            optOutStatus:
                              type: string
                      contactMetadata:
                        type: array
                        items:
                          type: string
                      groups:
                        type: array
                        items:
                          type: string
              required:
                - accountReference
            example:
              accountReference: SPNLxxxxxx
              contacts:
                - firstName: firstName
                  lastName: lastName
                  quickName: quickName
                  addresses:
                    - addressType: addressType
                      addressValue: addressValue
                      optOutStatus: optOutStatus
                  contactMetadata: []
                  groups:
                    - ""
      responses:
        "200":
          description: OK Success response with the following example body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accountReference:
                        type: string
                      contacts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            firstName:
                              type: string
                            lastName:
                              type: string
                            quickName:
                              type: string
                            addresses:
                              type: array
                              items:
                                type: object
                                properties:
                                  addressType:
                                    type: string
                                  addressValue:
                                    type: string
                            contactMetadata:
                              type: object
                              properties:
                                team:
                                  type: string
                            result:
                              type: string
                            reasons:
                              type: array
                              items:
                                type: string
              example:
                data:
                  accountReference: SPNL0000000
                  contacts:
                    - id: 5e89f37d-a101-4ac1-ba8e-736f18641432
                      firstName: Joe
                      lastName: Blogs
                      quickName: Blogs1
                      addresses:
                        - addressType: MSISDN
                          addressValue: "+447711000039"
                      contactMetadata:
                        team: octopus
                      result: success
                      reasons: []
                    - id: 6243c3b6-23b0-48a1-baf8-3bea83a473d7
                      firstName: Jon
                      lastName: Blogs
                      quickName: Blogs02
                      addresses:
                        - addressType: MSISDN
                          addressValue: "+447711000031"
                      contactMetadata:
                        team: octopus
                      result: success
                      reasons: []
        "400":
          description: |-
            Bad Request The server couldn't process the request due to one or more of the required fields being invalid or missing.

            Response example
        "401":
          description: |-
            Unauthorized The server couldn't process the request as the authentication was missing or invalid.

            Response example
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: An error occurred while processing the request
                status: 401
                message: Request for authenticated route '/v2/contacts/bulk' was unauthenticated
                errors: []
                internalErrors:
                  - message: Pipeline
                    metadata:
                      unauthenticatedError: Request for authenticated route '/v2/contacts/bulk' was unauthenticated
    patch:
      operationId: contactsBulkCreateOrUpdate
      summary: "Contacts: Bulk update/create"
      tags:
        - contacts
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/contacts/v2-contacts-bulk-create-or-update
      description: |-
        This endpoint allows you to add or edit a list of contacts in bulk with a single API call. This is the ideal tool for synchronizing your contact list from another system, such as a CRM, an e-commerce platform, or a customer database, ensuring your contacts are always up-to-date.

        The documentation in this section contains the core reference information you will need to create contacts via our API, including required headers, cURL sample & error codes.

        Before you start using this endpoint, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountReference:
                  type: string
                contactsId:
                  type: string
                  format: uuid
                contacts:
                  type: array
                  items:
                    type: object
                    properties:
                      firstName:
                        type: string
                      lastName:
                        type: string
                      quickName:
                        type: string
                      addresses:
                        type: array
                        items:
                          type: object
                          properties:
                            addressType:
                              type: string
                            addressValue:
                              type: string
                            optOutStatus:
                              type: string
                      contactMetadata:
                        type: array
                        items:
                          type: string
                      groups:
                        type: array
                        items:
                          type: string
              required:
                - accountReference
            example:
              accountReference: SPNLxxxxxx
              contacts:
                - firstName: firstName
                  lastName: lastName
                  quickName: quickName
                  addresses:
                    - addressType: addressType
                      addressValue: addressValue
                      optOutStatus: optOutStatus
                  contactMetadata: []
                  groups:
                    - ""
      responses:
        "200":
          description: OK Success response with the following example response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accountReference:
                        type: string
                      contacts:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            firstName:
                              type: string
                            lastName:
                              type: string
                            quickName:
                              type: string
                            addresses:
                              type: array
                              items:
                                type: object
                                properties:
                                  addressType:
                                    type: string
                                  addressValue:
                                    type: string
                            contactMetadata:
                              type: object
                              properties:
                                team:
                                  type: string
                            result:
                              type: string
                            reasons:
                              type: array
                              items:
                                type: string
              example:
                data:
                  accountReference: SPNL0000000
                  contacts:
                    - id: 5e89f37d-a101-4ac1-ba8e-736f18641432
                      firstName: John
                      lastName: Mclane
                      quickName: Roy
                      addresses:
                        - addressType: MSISDN
                          addressValue: "+447711000039"
                      contactMetadata:
                        team: octopus
                      result: success
                      reasons: []
                    - id: 6243c3b6-23b0-48a1-baf8-3bea83a473d7
                      firstName: Lisa
                      lastName: Mclane
                      quickName: Mclisa
                      addresses:
                        - addressType: MSISDN
                          addressValue: "+447711000031"
                      contactMetadata:
                        team: octopus
                      result: success
                      reasons: []
        "400":
          description: |-
            Bad Request The server couldn't process your request as one or more of the required fields are missing or have an invalid value.

            Response example
        "401":
          description: |-
            Unauthorized The server couldn't process the request as the authenication header is missing or invalid.

            Response example
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: An error occurred while processing the request
                status: 401
                message: Request for authenticated route '/v2/contacts/bulk' was unauthenticated
                errors: []
                internalErrors:
                  - message: Pipeline
                    metadata:
                      unauthenticatedError: Request for authenticated route '/v2/contacts/bulk' was unauthenticated
  /contacts/filter:
    get:
      operationId: contactsGetAll
      summary: "Contacts: Get all"
      tags:
        - contacts
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/contacts/v2-contacts-get-all
      description: |-
        This endpoint allows you to retrieve a list of all the data for your contacts associated with your account in a single API call. The request can be filtered by optOutStatus, sortBy, sortOrder, search, destination and groupId as well as other properties listed below. This is the ideal tool for synchronizing your contact list from another system, such as a CRM, an e-commerce platform, or a customer database, ensuring your contacts are always up-to-date.

        The documentation in this section contains the core reference information you will need to retrieve contacts via our API, including required headers, cURL sample & error codes.

        Before you start using this endpoint, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites.
      parameters:
        - name: AccountReference
          in: header
          required: true
          description: Your Spryng account reference - e.g. SPNL0000000
          schema:
            type: string
        - name: optOutStatus
          in: query
          required: false
          description: "Filter contacts by the optOutStatus. Allowed values are: subscribed or unsubscribed"
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          description: "Sort contacts into grouped data. Available values: Name | createdAt"
          schema:
            type: string
        - name: sortOrder
          in: query
          required: false
          description: "Sets the sorting direction. Default= descending. Available values: Asc & Desc"
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: "Ability to search using the following: address | first name | last name | quick name. Searching will retrieve information from all parameters"
          schema:
            type: string
        - name: destination
          in: query
          required: false
          description: "Filter contacts by the destination. Value should be a valid ISO3166 country code. For example: GB | DE | IT | US"
          schema:
            type: string
        - name: groupId
          in: query
          required: false
          description: Filter contacts by a certain groupId only
          schema:
            type: string
        - name: contactOwnership
          in: query
          required: false
          description: "Specifies the ownership type of a contact to filter by. Possible values: Shared | Owned | All. Default value = All"
          schema:
            type: string
      responses:
        "200":
          description: OK Success response with the following example response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      contacts:
                        type: array
                        items:
                          type: object
                          properties:
                            contactId:
                              type: string
                              format: uuid
                            accountReference:
                              type: string
                            firstName:
                              type: string
                            lastName:
                              type: string
                            quickName:
                              type: string
                            lastUpdatedBy:
                              type: string
                            smsoptOutStatus:
                              type: string
                            createTimestamp:
                              type: string
                              format: date-time
                            lastUpdateTimestamp:
                              type: string
                              format: date-time
                            addresses:
                              type: array
                              items:
                                type: object
                                properties:
                                  addressId:
                                    type: string
                                    format: uuid
                                  addressType:
                                    type: string
                                  addressValue:
                                    type: string
                                  destinationCode:
                                    type: string
                                  optOutStatus:
                                    type: string
                            contactMetadata:
                              type: object
                              properties:
                                additionalProp1:
                                  type: string
                                additionalProp2:
                                  type: string
                                additionalProp3:
                                  type: string
                      totalCount:
                        type: integer
                      totalPages:
                        type: integer
                      currentPage:
                        type: integer
              example:
                data:
                  contacts:
                    - contactId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                      accountReference: SPNL0000000
                      firstName: string
                      lastName: string
                      quickName: string
                      lastUpdatedBy: string
                      smsoptOutStatus: Subscribed
                      createTimestamp: "2025-05-26T12:37:30.770Z"
                      lastUpdateTimestamp: "2025-05-26T12:37:30.770Z"
                      addresses:
                        - addressId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                          addressType: string
                          addressValue: string
                          destinationCode: string
                          optOutStatus: Subscribed
                      contactMetadata:
                        additionalProp1: string
                        additionalProp2: string
                        additionalProp3: string
                  totalCount: 10
                  totalPages: 2
                  currentPage: 1
        "400":
          description: |-
            Bad Request The server couldn't process the request due to the accountReference missing from the header or is invalid.

            Response example
        "401":
          description: |-
            Unauthorized The server couldn't process the request as the authorization header is missin or invalid.

            Response example
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: unauthenticatedError
                    errorMessage: Request for authenticated route '/v2/contacts/filter' was unauthenticated
  /contacts/{contactId}:
    get:
      operationId: contactsGetById
      summary: "Contacts: Get"
      tags:
        - contacts
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/contacts/v2-contacts-get-by-id
      description: |-
        This endpoint allows you to retrieve data associated with a contact in a single API call. The request can be filtered by: Opt out status, date created, destination, groupId, first name, last name or quick name and other properties listed below. This is the ideal tool for synchronizing your contact list from another system, such as a CRM, an e-commerce platform, or a customer database, ensuring your contacts are always up-to-date.

        The documentation in this section contains the core reference information you will need to retrieve contacts via our API, including required headers, cURL sample & error codes.

        Before you start your implementation, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites.
      parameters:
        - name: contactId
          in: path
          required: true
          schema:
            type: string
        - name: optOutStatus
          in: query
          required: false
          description: Filter contacts by the optOutStatus allowed values are subscribed or unsubscribed
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
