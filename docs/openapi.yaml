        url: https://developer.spryng.nl/webhooks/v2-webhooks-delete-subscription
      description: This endpoint deletes all webhook subscriptions for an account. Only use this endpoint if you want to remove all updates being received for an account. This action is not revocable. If unintended, new webhook subscriptions would need to be created. To remove a specific event subscription, please use the Delete event endpoint.
