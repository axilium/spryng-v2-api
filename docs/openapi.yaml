  /url-shortener/visits:
    get:
      operationId: shortenerGet
      summary: "Messaging: Get URL metrics"
      tags:
        - messaging
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/messaging/v2-shortener-get
      description: |-
        This endpoint allows you to retrieve data associated with a request sent using shorten parameter. Both parameters can be used when using POST v2/messages, v2/schedule or v2/throttle-schedule

        Before you start using this endpoint, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites.
      parameters:
        - name: AcccountReference
          in: header
          required: true
          description: Your Spryng account reference - e.g. SPNL0000000
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          description: Pagination required for the response. Allow 1-1000. Default = 1
          schema:
            type: integer
        - name: pageNo
          in: query
          required: false
          description: Number of pages for the response. Allow 1+. Default = 1
          schema:
            type: integer
        - name: sortOrder
          in: query
          required: false
          description: Defines sorting order for the results. Enum e.g. Asc | Desc. Default = Desc
          schema:
            type: string
            enum:
              - Asc
              - Desc
        - name: sortBy
          in: query
          required: false
          description: Defines sorting requirements for the results Enum e.g. RequestSubmittedAt | RequestName. Default = submittedAt
          schema:
            type: string
            enum:
              - RequestSubmittedAt
              - RequestName
        - name: startTime
          in: query
          required: false
          description: Filter messages where submittedAt is greater than or equal to startTime
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          required: false
          description: Filter messages where submittedAt is less than or equal to endTime
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Ok Success response with the following example body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      requestsData:
                        type: array
                        items:
                          type: object
                          properties:
                            requestId:
                              type: string
                              format: uuid
                            requestName:
                              type: string
                            requestSubmittedAt:
                              type: string
                              format: date-time
                            totalShortUrlsCreated:
                              type: integer
                            totalShortUrlsVisited:
                              type: integer
                            totalVisits:
                              type: integer
                      totalCount:
                        type: integer
                      currentPage:
                        type: integer
                      totalPages:
                        type: integer
                      pageSize:
                        type: integer
              example:
                data:
                  requestsData:
                    - requestId: bdd92e6a-5225-4c17-9a12-ece92b185cbd
                      requestName: ""
                      requestSubmittedAt: "2025-08-22T15:20:37.258972Z"
                      totalShortUrlsCreated: 1
                      totalShortUrlsVisited: 1
                      totalVisits: 1
                    - requestId: 794b7e71-af6a-4346-9d5e-d79d6920637e
                      requestName: ""
                      requestSubmittedAt: "2025-08-22T14:48:28.346283Z"
                      totalShortUrlsCreated: 1
                      totalShortUrlsVisited: 1
                      totalVisits: 4
                  totalCount: 15
                  currentPage: 1
                  totalPages: 2
                  pageSize: 10
        "401":
          description: |-
            Unauthorized The server couldn't process the request as the authorization header was missing or invalid.

            Response example
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: UnauthenticatedError
                    errorMessage: Request for authenticated route '/v2/url-shortener/visits/1a9d09bc-dc26-4d37-ba32-0f792b3ef537%0A' was unauthenticated
