  /throttle-schedule:
    post:
      operationId: scheduledThrottleCreate
      summary: "Throttling: Create"
      tags:
        - throttling
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/throttling/v2-scheduled-throttle-create
      description: |-
        This API enables you to create a batch message request and then control the throughput so not all messages are sent at the same time. This can be configured to splitting messages into hourly batches, or setting a maximum number of messages to be sent within a timeframe i.e. that day.

        Not only does throttling for large batch sends ensure that networks don’t become overwhelmed by large requests, it also allows you to better determine the spread of inbound messaging received from a large outbound message.
        There are 2 types of throttling methods available via this API:

        - Rate based - control the rate limit of messages to be sent per hour. The platform will then calculate the estimated end date for the request based on the specified rate limit *
        - Period based - specify the end date required for all the messages within the request to be sent. The platform then determines the optimal rate limit for the request

        *any throttling schedules applied will still adhere to our default API rate limiting policy. All schedule times should be provided in UTC.
        Note: once all messages within a thottled schedule have all been accepted to the platform, the throttle schedule will no longer be editable.

        If you would like to duplicate a previous throttled schedule, send a GET request using v2/throttle-schedule/{throttleScheduleId} endpoint to gain the required information. If you're missing the throttle-scheduleId for the request you'd like to duplicate, you can view all throttle schedules by calling GET v2/throttle-schedule. The response data can then be copied to a new POST request as required using v2/throttle-schedule.

        Before you start using this endpoint, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites in our Introduction documentation.

        Please note: some countries have specific sending regulations, visit our support site for further information on [territory specific regulations](https://www.productsupport.esendex.com/regulations/). You can set up your SenderIds, STOP/CONTACT auto-responses for French recipients and other regulation configurations in the Esendex portal.
      parameters:
        - name: AccountReference
          in: header
          required: true
          description: Your Esendex account reference - e.g. SPNL000000
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                throttleScheduleInformation:
                  type: object
                  properties:
                    daysOfweek:
                      type: array
                      items:
                        type: string
                    startDate:
                      type: string
                    timeSlotStart:
                      type: string
                    timeSlotEnd:
                      type: string
                    endDate:
                      type: string
                    rateOfSend:
                      type: integer
                    daysOfWeek:
                      type: array
                      items:
                        type: string
                dispatch:
                  type: object
                  properties:
                    characterSet:
                      type: string
                      enum:
                        - Auto
                        - GSM
                        - Unicode
                    messageType:
                      type: string
                      enum:
                        - MarketingAndResearch
                        - NotificationsAndReminders
                        - AuthenticationAndSecurity
                        - PaymentsAndCollections
                        - InternalOperations
                        - CustomerSupport
                        - Conversational
                    name:
                      type: string
                    channel:
                      type: string
                    from:
                      type: string
                    body:
                      type: object
                      properties:
                        text:
                          type: string
                        templateId:
                          type: string
                    metaData:
                      type: array
                      items:
                        type: string
                metaData:
                  type: object
                recipients:
                  type: array
                  items:
                    type: object
                    properties:
                      msisdn:
                        type: string
                      variables:
                        type: array
                        items:
                          type: string
                      metaData:
                        type: array
                        items:
                          type: string
                contacts:
                  type: array
                  items:
                    type: object
                    properties:
                      contactId:
                        type: string
            example:
              throttleScheduleInformation:
                startDate: startDate
                timeSlotStart: string
                timeSlotEnd: string
                endDate: endDate
                rateOfSend: 0
                daysOfWeek:
                  - ""
              dispatch:
                name: name
                characterSet: characterSet
                channel: channel
                from: from
                messageType: messageType
                body:
                  text: text
                  templateId: templateId
                metaData: []
              recipients:
                - msisdn: msisdn
                  variables: []
                  metaData: []
              contacts:
                - contactId: contactId
      responses:
        "201":
          description: Created The requested schedule has been created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      throttleScheduleId:
                        type: string
                        format: uuid
                      estimatedEndDateTime:
                        type: string
                        format: date-time
                      numberOfRecipients:
                        type: integer
              example:
                data:
                  throttleScheduleId: 9ecac452-f585-4b1f-be45-7657a8583521
                  estimatedEndDateTime: "2025-07-10T15:51:00.0000000Z"
                  numberOfRecipients: 1
        "400":
          description: Bad Request The server could not understand the request due to incorrect syntax or an incorrect/missing required property. You should not repeat the request without modifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: string
                    errorMessage: string
        "401":
          description: Unauthorized Indicates that the request has failed due to missing or incorrect authentication information. You can repeat the request with a suitable authorization header field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: unauthenticatedError
                    errorMessage: Request for authenticated route '/api/v2/throttle-schedule' was unauthenticated
    get:
      operationId: scheduledThrottleGetAll
      summary: "Throttling: Get all"
      tags:
        - throttling
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/throttling/v2-scheduled-throttle-get-all
      description: |-
        This guide explains how to retrieve all Throttle Schedules, add additional filtering on all the throttled schedules by adding a query parameter for FromStartDate, ToStartDate, FromCreatedDate, ToCreatedDate, Status, Msisdns and more

        Before you start your implementation, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites in our [Introduction documentation](https://developer.esendex.co.uk/home/esendex-uk-introduction).
      parameters:
        - name: AccountReference
          in: header
          required: true
          description: Your Esendex account reference - e.g. SPNL000000
          schema:
            type: string
        - name: FromStartDate
          in: query
          required: false
          description: Filter all the throttled schedules from a certain date. If both FromStartDate and ToStartDate are provided then throttled sends starting between the dates will be returned. Date must be provided in YYYY-MM-DD format
          schema:
            type: string
        - name: ToStartDate
          in: query
          required: false
          description: Filter all throttled schedules until the start date provided. If both FromStartDate and ToStartDate are provided then throttled sends starting between the dates will be returned. Date must be provided in YYYY-MM-DD format
          schema:
            type: string
        - name: FromCreatedDate
          in: query
          required: false
          description: Filter all throttled schedules from the created date provided. If both FromCreatedDate and ToCreatedDate are provided then throttled sends starting between the dates will be returned. Date must be provided in YYYY-MM-DD format
          schema:
            type: string
        - name: ToCreatedDate
          in: query
          required: false
          description: Filter all throttled schedules until the created date provided. If both FromCreatedDate and ToCreatedDate are provided then throttled sends starting between the dates will be returned. Date must be provided in YYYY-MM-DD format
          schema:
            type: string
        - name: Status
          in: query
          required: false
          description: "Filter by the status of the throttled schedules. Available options are: Active | Paused | Cancelled | Failed | Completed | PartiallyCompleted"
          schema:
            type: string
        - name: msisdn
          in: query
          required: false
          description: The phone number that received the outbound message. Must use international format e.g. 447xxxxxxxxx. This lets you filter for all messages to an MSISDN
          schema:
            type: string
        - name: PageSize
          in: query
          required: false
          description: Pagination required for the response. Allow 1-1000. Default = 1
          schema:
            type: string
        - name: PageNumber
          in: query
          required: false
          description: Number of pages for the response. Allow 1+. Default = 1
          schema:
            type: string
        - name: OrderDir
          in: query
          required: false
          description: "Sets the sorting direction. Default = descending. Available values: Asc & Desc"
          schema:
            type: string
      responses:
        "200":
          description: OK Indicates that the request has been completed.
        "400":
          description: Bad Request The server could not understand the request due to incorrect syntax or an incorrect/missing required property. You should not repeat the request without modifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: string
