  /webhooks/subscriptions:
    post:
      operationId: webhooksCreateSubscription
      summary: "Webhooks: Create"
      tags:
        - webhooks
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/webhooks/v2-webhooks-create-subscription
      description: |-
        This endpoint allows for the creation of a new webhook event subscription.

        Webhooks are automated messages sent from our applications when something happens (an event occurs) and received to any valid public URL or application* included in your request. This event-triggered communication allows for near real-time data sharing, providing instant updates on message statuses and more. You must create a new webhook for each event you would like to subscribe to or receive updates on.

         A full list of available events is listed below. Please see the other documentation pages in the Webhooks section of this site for further information on possible webhook actions. Spryng has multiple options for additional security and webhook authentication. Please see our Webhook Authentication page for more information.

        Note: *the receiving service must be a publicly accessible web page or web service which you host.
      parameters:
        - name: ContentType
          in: header
          required: true
          description: application/json
          schema:
            type: string
        - name: AccountReference
          in: header
          required: true
          description: Your Esendex account reference - e.g. SPNL0000000
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  eventType:
                    type: string
                  callbacks:
                    type: array
                    items:
                      type: object
                      properties:
                        url:
                          type: string
                        platform:
                          type: string
                        optionalNotes:
                          type: string
                  requiresAuthentication:
                    type: boolean
                  contactEmail:
                    type: string
            example:
              - eventType: eventType
                callbacks:
                  - url: url
                    platform: platform
                    optionalNotes: optionalNotes
                requiresAuthentication: false
                contactEmail: contactEmail
      responses:
        "201":
          description: |-
            Created Success response with empty body

            Error codes
        "400":
          description: Bad Request The server could not understand the request due to incorrect syntax or an incorrect/missing required property aka missing or incorrect account reference provided. You should not repeat the request without modifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: webhook_subscription_not_found
                    errorMessage: Webhook subscription not found for this account and this event type
        "401":
          description: Unauthorized Indicates that the request has failed due to missing or incorrect authentication information. You can repeat the request with a suitable authorization header field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: unauthenticatedError
                    errorMessage: Request for authenticated route '/v2/webhooks/subscriptions' was unauthenticated
