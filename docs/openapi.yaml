    delete:
      operationId: groupsDeleteContactsFromGroup
      summary: "Groups: Remove contacts"
      tags:
        - groups
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/groups/v2-groups-delete-contacts-from-group
      description: |-
        This endpoint allows you to remove one or more contacts from a single group. Removing contacts from a group does not delete the contact record or the group. A group can still exist with no associated contacts. To delete a group, please refer to the Delete documentation within the Group category. This is the perfect tool for maintaining your contact list from another system, such as a CRM, an e-commerce platform, or a customer database, ensuring your contacts are always up-to-date.

        Before you start using this endpoint, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: contactId
          in: query
          required: false
          description: One or more contacts to be deleted from a single group. contactIds must be provided as a GUID within the path. If more than one contact is being removed provide contactIds as an array
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: |-
            OK Success response with empty body.

            Error codes
        "400":
          description: |-
            Bad Request The server was unable to process the request due to missing or invalid contactId provided.
            Response example
        "401":
          description: |-
            Unauthorized The authorization header is missing or invalid.
            Response example
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: An error occurred while processing the request
                status: 401
                message: Request for authenticated route '/v2/groups/cb960734-8a57-442d-983c-92526456d3ed/contacts' was unauthenticated
                errors: []
                internalErrors:
                  - message: Pipeline
                    metadata:
                      unauthenticatedError: Request for authenticated route '/v2/groups/cb960734-8a57-442d-983c-92526456d3ed/contacts' was unauthenticated
        "404":
          description: |-
            Not Found The server could not process the request due to missing or invalid groupId.
            Response example
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: group_not_found
                    errorMessage: There is no group with the specified Id.
    get:
      operationId: groupsGetContactsFromGroup
      summary: "Groups: Get contacts from Group"
      tags:
        - groups
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/groups/v2-groups-get-contacts-from-group
      description: |-
        This endpoint allows you to retrieve a list of all contacts within a group associated with your account in a single API call. The request can be filtered by: groupId, accountReference, destination, metadataKey, Search, pageSize, pageNo, sortOrder and sortBy. This is the ideal tool for synchronizing your contact list from another system, such as a CRM, an e-commerce platform, or a customer database, ensuring your contacts are always up-to-date.

        Before you start using this endpoint, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: AccountReference
          in: header
          required: true
          description: Your Spryng account reference - e.g. SPNL0000000
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: "Ability to search using the following: address | first name | last name | quick name. Searching will retrieve information from all parameters"
          schema:
            type: string
        - name: destination
          in: query
          required: false
          description: "Filter contacts by the destination. Value should be a valid ISO3166 country code. For example: GB | DE | IT | US"
          schema:
            type: string
        - name: contactOwnership
          in: query
          required: false
          description: "Specifies the ownership type of a contact to filter by. Possible values: Shared | Owned | All. Default value = All"
          schema:
            type: string
        - name: sortBy
          in: query
          required: false
          description: "Sort contacts. Available values: name"
          schema:
            type: string
        - name: sortOrder
          in: query
          required: false
          description: "Sets the sorting direction. Default = descending. Available values: Asc & Desc"
          schema:
            type: string
        - name: optOutStatus
          in: query
          required: false
          description: Filter contacts by the optOutStatus. Allowed values are subscribed or unsubscribed
          schema:
            type: string
      responses:
        "200":
          description: OK Success response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      contacts:
                        type: array
                        items:
                          type: object
                          properties:
                            contactId:
                              type: string
                              format: uuid
                            accountReference:
                              type: string
                            firstName:
                              type: string
                            lastName:
                              type: string
                            quickName:
                              type: string
                            lastUpdatedBy:
                              type: string
                            smsoptOutStatus:
                              type: string
                            contactOwnership:
                              type: string
                            createTimestamp:
                              type: string
                              format: date-time
                            lastUpdateTimestamp:
                              type: string
                              format: date-time
                            addresses:
                              type: array
                              items:
                                type: object
                                properties:
                                  addressId:
                                    type: string
                                    format: uuid
                                  addressType:
                                    type: string
                                  addressValue:
                                    type: string
                                  destinationCode:
                                    type: string
                                  optOutStatus:
                                    type: string
                            contactMetadata:
                              type: array
                              items:
                                type: string
                      filterOptions:
                        type: object
                        properties:
                          accountReference:
                            type: string
                      totalCount:
                        type: integer
                      totalPages:
                        type: integer
                      currentPage:
                        type: integer
              example:
                data:
                  contacts:
                    - contactId: 8d0267b6-9163-41c2-a8d0-b9164a103a75
                      accountReference: SPNL0000000
                      firstName: John
                      lastName: Mclane
                      quickName: Roy
                      lastUpdatedBy: Octopus
                      smsoptOutStatus: Subscribed
                      contactOwnership: Shared
                      createTimestamp: "2025-09-26T06:48:53.205527Z"
                      lastUpdateTimestamp: "2025-09-26T06:48:55.244424Z"
                      addresses:
                        - addressId: d158859a-c377-4ec5-b4b0-2ceffbe0f704
                          addressType: MSISDN
                          addressValue: "+447703787198"
                          destinationCode: GB
                          optOutStatus: Subscribed
                      contactMetadata: []
                  filterOptions:
                    accountReference: "{accountReference}"
                  totalCount: 1
                  totalPages: 1
                  currentPage: 1
        "400":
          description: |-
            Bad Request The server could not process the request due to incorrect or missing required properties.
            Response example
        "401":
          description: |-
            Unauthorized The server couldn't process the request due to missing or incorrect authorization value.
            Response example
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                title: An error occurred while processing the request
                status: 401
                errors: []
                internalErrors:
                  - message: Pipeline
                    metadata:
                      unauthenticatedError: Request for authenticated route '/v2/groups' was unauthenticated
  /inbox:
    get:
      operationId: messagesGetInbox
      summary: "Messaging: Inbox"
      tags:
        - messaging
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/messaging/v2-messages-get-inbox
      description: |-
        This endpoint retrieves all inbound message data associated with your account. This can be filtered based on channel, message type, status, userId and more. 

        Before you start using this endpoint, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites in our Introduction documentation.
      parameters:
        - name: AcccountReference
          in: header
          required: true
          description: Your Spryng account reference - e.g. SPNL0000000
          schema:
            type: string
        - name: accountReference
          in: query
          required: false
          description: The list of account references provided as an array
          schema:
            type: array
            items:
              type: string
        - name: requestId
          in: query
          required: false
          description: Will filter to requestIds provided for the request
          schema:
            type: string
            format: uuid
        - name: conversationId
          in: query
          required: false
          description: Will show all inbound and outbound messages belonging to a conversation. A conversation is unique by account-recipient and will contain all messages to and from a recipient in an account
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          description: Status of the requested message(s). Enum e.g. Delivered | Received | Failed | In Progress
          schema:
            type: string
            enum:
              - Delivered
              - Received
              - Failed
              - In Progress
        - name: reason
          in: query
          required: false
          description: Failure reason provided as an enum e.g. Delivered | DestinationNotAllowed | LandlineNotAllowed | MessageExpired | MessagePartCountExceeded | MsisdnInvalid | NetworkFailed | OptedOut | OutsideBusinessHours | senderIdInvalid | SendingLimitExceeded | WithinQuietHours
          schema:
            type: string
            enum:
              - Delivered
              - DestinationNotAllowed
              - LandlineNotAllowed
              - MessageExpired
              - MessagePartCountExceeded
              - MsisdnInvalid
              - NetworkFailed
              - OptedOut
              - OutsideBusinessHours
              - senderIdInvalid
              - SendingLimitExceeded
              - WithinQuietHours
        - name: msisdn
          in: query
          required: false
          description: The phone number that received the outbound message or the phone number that sent the inbound message. Must use international format e.g. 447xxxxxxxxx. This lets you filter for all messages from and to an MSISDN
          schema:
            type: string
        - name: destinationCode
          in: query
          required: false
          description: Nullable. 2-letter ISO3166 destination code for the destination of the message e.g. Destination sent to or destination received from
          schema:
            type: string
        - name: originator
          in: query
          required: false
          description: The "from" value for outbound messages or the "to" value for inbound messages. This lets you filter for all messages from and to an originator such as a VMN or Shortcode or senderId
          schema:
            type: string
        - name: requestName
          in: query
          required: false
          description: Nullable. Optional name of the request
          schema:
            type: string
        - name: channel
          in: query
          required: false
          description: Channel the message was sent via. Enum e.g.SMS
          schema:
            type: string
        - name: messageType
          in: query
          required: false
          description: Enum e.g. Unknown | MarketingAndResearch | NotificationsAndReminders | AuthenticationAndSecurity | PaymentsAndCollections
          schema:
            type: string
            enum:
              - Unknown
              - MarketingAndResearch
              - NotificationsAndReminders
              - AuthenticationAndSecurity
              - PaymentsAndCollections
        - name: source
          in: query
          required: false
          description: Which product area provided the message
          schema:
            type: string
        - name: startTime
          in: query
          required: false
          description: Filter messages where submittedAt is greater than or equal to startTime
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          required: false
          description: Filter messages where submittedAt is less than or equal to endTime
          schema:
            type: string
            format: date-time
        - name: pageSize
          in: query
          required: false
          description: Pagination required for the response. Allow 1-1000. Default = 1
          schema:
            type: integer
        - name: pageNo
          in: query
          required: false
          description: Number of pages for the response. Allow 1+. Default = 1
          schema:
            type: integer
        - name: sortOrder
          in: query
          required: false
          description: Defines sorting order for the results. Enum e.g. Asc | Desc. Default = Desc
          schema:
            type: string
            enum:
              - Asc
              - Desc
        - name: sortBy
          in: query
          required: false
          description: Defines sorting requirements for the results Enum e.g. Status | submittedAt | lastupdateTimestamp | channel | messageType | source | requestName. Default = submittedAt
          schema:
            type: string
            enum:
              - Status
              - submittedAt
              - lastupdateTimestamp
              - channel
              - messageType
              - source
              - requestName
        - name: retrieveMessageBody
          in: query
          required: false
          description: Provide if message body is required within the response. Default = TRUE
          schema:
            type: boolean
        - name: direction
          in: query
          required: false
          description: Enum e.g. Outbound/ Inbound
          schema:
            type: string
        - name: includeDelete
          in: query
          required: false
          description: Default = FALSE. If 'TRUE' then the response will include messages which were marked as deleted. These soft-deleted messages will have all their PII removed and only exist for billing reconciliation purposes
          schema:
            type: boolean
      responses:
        "200":
          description: OK Indicates that the request has succeeded.
        "401":
          description: Unauthorized Indicates that the request has failed due to missing or incorrect authentication information. You can repeat the request with a suitable authorization header field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: unauthenticatedError
                    errorMessage: Request for authenticated route '/v2/inbox' was unauthenticated
  /messages:
    post:
      operationId: messagesCreate
      summary: "Messaging: Send"
      tags:
        - messaging
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/messaging/v2-messages-create
      description: |-
        This endpoint enables you to take your customers on a seamless messaging journey, foster a deeper connection with your brand, and gain valuable customer insights along the way. Whether you're sending to one recipient or multiple, you can do it all in a single request.

        The documentation in this section contains the core reference information you will need to send an outbound message via our API, including required headers, code examples & error codes.

        Before you start using this endpoint, please check you have your Account, API Key and Base URL set up and have familiarised yourself with our implementation prerequisites in our Introduction documentation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                accountReference:
                  type: string
                channel:
                  type: string
                body:
                  type: object
                  properties:
                    text:
                      type: string
                    templateId:
                      type: string
                      format: uuid
                    shortenUrlBrand:
                      type: string
                    attachment:
                      type: object
                      properties:
                        attachmentUrl:
                          type: string
                        fileName:
                          type: string
                        description:
                          type: string
                from:
                  type: string
                recipients:
                  type: array
                  items:
                    type: object
                    properties:
                      msisdn:
                        type: string
                      variables:
                        type: array
                        items:
                          type: string
                      metaData:
                        type: array
                        items:
                          type: string
                addressBook:
                  type: object
                  properties:
                    contacts:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                    groups:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                name:
                  type: string
                characterSet:
                  type: string
                  enum:
                    - Auto
                    - GSM
                    - Unicode
                validity:
                  type: string
                  format: date-time
                messageType:
                  type: string
                  enum:
                    - MarketingAndResearch
                    - NotificationsAndReminders
                    - AuthenticationAndSecurity
                    - PaymentsAndCollections
                    - InternalOperations
                    - CustomerSupport
                    - Conversational
                metaData:
                  type: array
                  items:
                    type: string
              required:
                - accountReference
                - channel
                - body
            example:
              accountReference: SPNLxxxxxx
              name: name
              characterSet: characterSet
              channel: channel
              from: from
              validity: validity
              messageType: messageType
              body:
                text: text
                templateId: templateId
                shortenUrlBrand: shortenUrlBrand
                attachment:
                  attachmentUrl: attachmentUrl
                  fileName: fileName
                  description: description
              recipients:
                - msisdn: msisdn
                  variables: []
                  metaData: []
              addressBook:
                contacts:
                  - id: id
                groups:
                  - id: id
              metaData: []
      responses:
        "202":
          description: Accepted Indicates that the request has been received but not completed yet.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      requestId:
                        type: string
                        format: uuid
                      messageIds:
                        type: array
                        items:
                          type: string
                          format: uuid
              example:
                data:
                  requestId: 8dcad127-bb9c-48fe-9827-db2fe57d53fb
                  messageIds:
                    - 0929df71-d1ea-4b02-87b2-9789b332a92e
        "400":
          description: Bad Request The server could not understand the request due to incorrect syntax or an incorrect/missing required property. You should not repeat the request without modifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: string
                    errorMessage: string
        "401":
          description: Unauthorized Indicates that the request has failed due to missing or incorrect authentication information. You can repeat the request with a suitable authorization header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
                  - errorCode: unauthenticatedError
                    errorMessage: Request for authenticated route '/v2/messages' was unauthenticated
