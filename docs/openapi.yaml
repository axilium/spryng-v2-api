openapi: 3.1.0
info:
  title: Spryng Messaging v2 API
  version: 20260619-1
  license:
    name: MIT
    identifier: MIT
  description: |-
    Reconstructed from the Spryng developer portal at https://developer.spryng.nl.

    Generated by tools/build-openapi.php from the mirror in docs/api. Spryng does
    not publish an OpenAPI document, so schemas are inferred from the parameter
    tables and example payloads in the documentation. Treat it as a close reading
    of the docs, not as a contract from the vendor.
servers:
  - url: https://api.spryng.nl/v2
security:
  - apiKey: []
tags:
  - name: balance
    description: Endpoints documented under "Balance" in the portal.
  - name: contacts
    description: Endpoints documented under "Contacts" in the portal.
  - name: groups
    description: Endpoints documented under "Groups" in the portal.
  - name: messaging
    description: Endpoints documented under "Messaging" in the portal.
  - name: opt-outs
    description: Endpoints documented under "Opt outs" in the portal.
  - name: schedule
    description: Endpoints documented under "Schedule" in the portal.
  - name: templates
    description: Endpoints documented under "Templates" in the portal.
  - name: throttling
    description: Endpoints documented under "Throttling" in the portal.
  - name: webhooks
