              example:
                errors:
                  - errorCode: unauthenticatedError
                    errorMessage: Request for authenticated route '/v2/webhooks/subscriptions' was unauthenticated
        "404":
          description: Not Found The server can not find the requested resource. The eventType is either missing or incorrect.#
