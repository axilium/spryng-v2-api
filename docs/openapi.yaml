  /webhooks/authentication-methods:
    put:
      operationId: webhooksUpdateAuthentication
      summary: "Webhooks: Authentication"
      tags:
        - webhooks
      externalDocs:
        description: Portal page
        url: https://developer.spryng.nl/webhooks/v2-webhooks-update-authentication
      description: |-
        This endpoint can be used to increase the authentication required for webhooks on an account. This increases security for webhooks used, meaning a consumer can verify they’re receiving a webhook from an expected source and the webhook producer can verify the customer.

        There are 3 possible authentication methods available:

        - Basic Authentication/ Username & Password
        - OAuth Verification Token/ Bearer Token
        - Custom Headers/ API Key

        A maximum of one authentication method can be set per account.If the type of the authentication method is updated, this is automatically reflected on all existing subscriptions of that account.If more than one authentication method is specified, the request will fail with a 400 status code.
      parameters:
        - name: AccountReference
          in: header
          required: true
          description: Your Esendex account reference - e.g. SPNL0000000
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clientIdValue:
                  type: string
                clientSecretIdPropertyValue:
                  type: string
                clientSecurityValue:
                  type: string
                clientSecretPropertyName:
                  type: string
                tokenUrl:
                  type: string
                accessTokenPropertyName:
                  type: string
                key:
                  type: string
                value:
                  type: string
                asQueryParam:
                  type: boolean
                username:
                  type: string
                password:
                  type: string
                basicToken:
                  type: string
                oauth:
                  type: object
                  properties:
                    clientIdValue:
                      type: string
                    clientIdPropertyName:
                      type: string
                    clientSecretValue:
                      type: string
                    clientSecretPropertyName:
                      type: string
                    tokenUrl:
                      type: string
                    accessTokenPropertyName:
                      type: string
                apiKey:
                  type: object
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                    asQueryParam:
                      type: boolean
                basic:
                  type: object
                  properties:
                    username:
                      type: string
                    password:
                      type: string
                    token:
                      type: string
            example:
              oauth:
                clientIdValue: clientIdValue
                clientIdPropertyName: clientIdPropertyName
                clientSecretValue: clientSecretValue
                clientSecretPropertyName: clientSecretPropertyName
                tokenUrl: tokenUrl
                accessTokenPropertyName: accessTokenPropertyName
              apiKey:
                key: key
                value: value
                asQueryParam: false
              basic:
                username: username
                password: password
                token: token
      responses:
        "201":
          description: |-
            Created Success response
            Errors
        "400":
          description: Bad Request The server could not understand the request due to incorrect syntax or an incorrect/missing required property. You should not repeat the request without modifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                errors:
