            type: string
        - name: RequestId
          in: query
          required: false
          description: Will filter to requestIds provided for the request
          schema:
            type: string
            format: uuid
        - name: Status
          in: query
          required: false
          description: Status of the requested messages. Enum e.g. Delivered | Received | Failed | In Progress
          schema:
            type: string
            enum:
              - Delivered
              - Received
              - Failed
              - In Progress
        - name: RequestReason
          in: query
          required: false
          description: Failure reason provided as an enum e.g. Delivered | DestinationNotAllowed | DisallowedContent | Inbound | InternalError | LandlineNotAllowed | MessagePartCountExceeded | MsisdnInvalid | OptedOut | OutsideBusinessHours | PartiallyDelivered | senderIdInvalid | SendingLimitExceeded | WithinQuietHours
          schema:
            type: string
            enum:
              - Delivered
              - DestinationNotAllowed
              - DisallowedContent
              - Inbound
              - InternalError
              - LandlineNotAllowed
              - MessagePartCountExceeded
              - MsisdnInvalid
              - OptedOut
              - OutsideBusinessHours
              - PartiallyDelivered
              - senderIdInvalid
              - SendingLimitExceeded
              - WithinQuietHours
        - name: RequestedOriginator
          in: query
          required: false
          description: The "from" value for outbound messages or the "to" value for Inbound messages. This lets you filter for all messages from and to an originator such as a VMN or Shortcode or senderId
          schema:
            type: string
        - name: RequestName
          in: query
          required: false
          description: Nullable. Optional name of the request
          schema:
            type: string
        - name: Channel
          in: query
          required: false
          description: Channel the message was sent via. Enum e.g. SMS
          schema:
            type: string
        - name: MessageType
          in: query
          required: false
          description: Enum e.g. Unknown | MarketingAndResearch | NotificationsAndReminders | AuthenticationAndSecurity | PaymentsAndCollections | InternalOperations | CustomerSupport | Conversational
          schema:
            type: string
            enum:
              - Unknown
              - MarketingAndResearch
              - NotificationsAndReminders
              - AuthenticationAndSecurity
              - PaymentsAndCollections
              - InternalOperations
              - CustomerSupport
              - Conversational
        - name: Source
          in: query
          required: false
          description: Which product area provided the message
          schema:
            type: string
        - name: StartTime
          in: query
          required: false
          description: Filter messages where submittedAt is greater than or equal to startTime
          schema:
            type: string
            format: date-time
        - name: EndTime
          in: query
          required: false
          description: Filter messages where submittedAt is less than or equal to endTime
          schema:
            type: string
            format: date-time
        - name: PageSize
          in: query
          required: false
          description: Pagination required for the response. Allow 1-1000. Default = 1
          schema:
            type: integer
        - name: PageNo
          in: query
          required: false
          description: Number of pages for the response. Allow 1+. Default = 1
          schema:
            type: integer
        - name: SortOrder
          in: query
          required: false
          description: Defines sorting order for the results. Enum e.g. Asc/ Desc. Default = Desc
          schema:
            type: string
        - name: SortBy
          in: query
          required: false
          description: Defines sorting requirements for the results Enum e.g. Status | SubmittedAt | LastupdateTimestamp | Channel | MessageType | Source | RequestName. Default = submittedAt
          schema:
            type: string
            enum:
              - Status
              - SubmittedAt
              - LastupdateTimestamp
              - Channel
              - MessageType
              - Source
              - RequestName
