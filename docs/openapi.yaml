components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: API key generated in the Spryng portal.
  schemas:
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              errorCode:
                type: string
              errorMessage:
                type: string
              metadata:
                type: object
                properties:
                  additionalProp1:
                    type: string
                  additionalProp2:
                    type: string
                  additionalProp3:
                    type: string
            additionalProperties: true
        title:
          type: string
        status:
          type: integer
        message:
          type: string
        internalErrors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
              metadata:
                type: object
                properties:
                  unauthenticatedError:
                    type: string
      additionalProperties: true
