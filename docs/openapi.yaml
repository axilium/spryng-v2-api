        - name: AccountReference
          in: header
          required: true
          description: Your Spryng account reference - e.g. SPNL0000000
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                templateType:
                  type: string
                messageType:
                  type: string
                  enum:
                    - Unknown
                    - MarketingAndResearch
                    - NotificationsAndReminders
                    - AuthenticationAndSecurity
                    - PaymentsAndCollections
                    - InternalOperations
                    - CustomerSupport
                    - Conversational
                    - BlueLight
                channelSettings:
                  type: object
                  properties:
                    sms:
                      type: object
                      properties:
                        characterSet:
                          type: string
                content:
                  type: string
